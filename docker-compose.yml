services:
  postgres:
    image: postgres:17-alpine
    container_name: picpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: digital_wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD (veja .env.example)}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d digital_wallet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
