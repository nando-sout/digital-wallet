spring.application.name=digital-wallet
server.port=8080

# Datasource - valores via variaveis de ambiente; URL e usuario tem defaults de desenvolvimento local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/digital_wallet}
spring.datasource.username=${DB_USERNAME:wallet}
# Sem valor padrao: a senha deve vir obrigatoriamente da variavel de ambiente DB_PASSWORD
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway - migracoes em classpath:db/migration (localizacao padrao)
spring.flyway.enabled=true

# Autorizador externo de transferencias (mock publico do desafio, sem credenciais)
app.authorizer.url=${AUTHORIZER_URL:https://util.devi.tools/api/v2/authorize}
app.authorizer.connect-timeout=2s
app.authorizer.read-timeout=3s

# Notificador do recebedor (mock publico do desafio: POST sem corpo, melhor esforco)
app.notifier.url=${NOTIFIER_URL:https://util.devi.tools/api/v1/notify}
app.notifier.connect-timeout=2s
app.notifier.read-timeout=3s
